# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=evaltrack

# Database Configuration (PostgreSQL with H2 fallback for local dev)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:evaltrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (enabled for local debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Custom Application Properties
evaltrack.jwt.secret=${JWT_SECRET:9a4f2c8d1e3b5a7f9a4f2c8d1e3b5a7f9a4f2c8d1e3b5a7f9a4f2c8d1e3b5a7f}
evaltrack.jwt.expiration-ms=86400000
evaltrack.upload.dir=${STORAGE_PATH:./uploads}

# Jackson JSON Configuration
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/,file:${evaltrack.upload.dir}/
