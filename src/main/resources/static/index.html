<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvalTrack — Proctored Examination & Coursework Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Auth View Container (Login & Register) -->
  <div id="auth-wrapper" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo-icon">E</div>
        <h1>EvalTrack</h1>
      </div>
      <div id="auth-card-body"></div>
    </div>
  </div>

  <!-- App Layout Container (Sidebar, Top Navbar, Content Area) -->
  <div id="app-container" class="app-container hidden">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon" style="width: 36px; height: 36px; background: var(--primary); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold;">E</div>
        <h2 style="font-size: 20px; font-weight: 800;">EvalTrack</h2>
      </div>

      <ul class="sidebar-menu" id="sidebar-menu">
        <!-- Dynamic role-based navigation links rendered here -->
      </ul>

      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-secondary btn-sm" style="width: 100%;">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content Panel -->
    <div class="main-content">
      <!-- Top Navbar -->
      <header class="top-navbar">
        <div style="font-weight: 600; font-size: 15px; color: var(--text-muted);">
          Online Examination & Coursework System
        </div>

        <div class="user-badge">
          <div id="nav-user-avatar" class="user-avatar">U</div>
          <div style="text-align: right;">
            <div id="nav-user-name" style="font-weight: 600; font-size: 14px;">User</div>
            <div id="nav-user-role" style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Role</div>
          </div>
        </div>
      </header>

      <!-- Page Body Content View -->
      <main id="page-body" class="page-body">
        <!-- Dynamic View Loaded Here -->
      </main>
    </div>

  </div>

  <!-- Client JavaScript Modules -->
  <script src="js/api.js"></script>
  <script src="js/proctoring.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
